<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Manager</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="conn-banner" class="conn-banner hidden"></div>

  <header>
    <h1>Jira Manager</h1>
    <div class="who" id="who"></div>
    <div class="actions">
      <input type="email" id="view-email" class="view-email" placeholder="View user by email…" title="Enter a colleague's email to view their items">
      <button id="btn-view">View</button>
      <label class="toggle-label"><input type="checkbox" id="chk-completed"> Show completed</label>
      <button id="btn-new" class="primary">+ New item</button>
      <button id="btn-report" title="Generate a monthly report slide">📊 Monthly Report</button>
      <button id="btn-onhold" title="Cancel items on hold longer than the threshold">Cancel stale on-hold</button>
      <button id="btn-sprint-change" title="Clone every open, due story/task (and its open sub-tasks) into a new (Iter N) batch, and stage the originals as Done">🔁 Sprint Change all</button>
      <button id="btn-refresh">Refresh from Jira</button>
      <button id="btn-review">Review changes <span class="badge" id="stage-count">0</span></button>
    </div>
  </header>

  <main>
    <section id="tree-pane">
      <h2>My epics &amp; tasks</h2>
      <div class="tree-search">
        <input type="search" id="tree-search" placeholder="🔍 Search epics, stories, sub-tasks…"
               title="Filter the tree by key, summary, type or status" autocomplete="off">
        <button id="tree-search-clear" class="tree-search-clear hidden" title="Clear search">✕</button>
      </div>
      <div id="tree" class="tree"><p class="muted">Loading…</p></div>
    </section>

    <section id="detail-pane">
      <div id="detail" class="detail">
        <p class="muted">Select an item from the tree to view and edit it.</p>
      </div>
    </section>
  </main>

  <!-- Generic modal host -->
  <div id="modal-overlay" class="overlay hidden">
    <div class="modal" id="modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
